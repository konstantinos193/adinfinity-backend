# Blue-green production stack for the VPS. scripts/deploy.sh starts the idle
# colour, health-checks it, repoints nginx, then stops the other one. Local
# development uses docker-compose.dev.yml instead.
#
# Explicit project name: the default would be the folder name, which is not
# stable across checkouts and would make Compose adopt/replace the wrong
# containers.
name: adinfinity

x-backend: &backend
  restart: unless-stopped
  env_file: .env
  networks:
    - adinfinity
  # The API binds 3001 inside the container regardless of colour; only the host
  # port differs, so the same image runs as either.
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 20s

services:
  backend-blue:
    <<: *backend
    image: adinfinity-backend:blue
    container_name: adinfinity-blue
    ports:
      - "127.0.0.1:3010:3001"
    profiles:
      - blue

  backend-green:
    <<: *backend
    image: adinfinity-backend:green
    container_name: adinfinity-green
    ports:
      - "127.0.0.1:3011:3001"
    profiles:
      - green

networks:
  # Created by deploy.sh, not Compose, so `compose --profile blue down` never
  # tries to remove it while green (or the DB container) is still attached.
  # The standalone `adinfinity-pg` container is joined to it so DATABASE_URL can
  # use the hostname `adinfinity-pg` instead of the host's loopback, which is
  # not reachable from inside a bridge-networked container.
  adinfinity:
    name: adinfinity-net
    external: true
